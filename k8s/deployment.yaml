apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: mdaabidh14/flask-devops-demo:fa3899b7f69d2035d278c4c706fbb0139b719ae5
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v1.0"