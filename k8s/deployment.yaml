apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: mdaabidh14/flask-devops-demo:5887745f8431f8306801554ab0644a57e105415c
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v1.0"