apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: mdaabidh14/flask-devops-demo:34c7a13d2dccb3434d2d66ce839069dc225f034b
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v1.0"