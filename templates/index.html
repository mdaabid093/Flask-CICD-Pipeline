<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flask DevOps Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 48px 56px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    max-width: 480px;
    width: 90%;
  }

  .emoji { font-size: 48px; margin-bottom: 8px; }

  h1 {
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #f8fafc;
  }

  .subtitle {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 28px;
  }

  .version-badge {
    display: inline-block;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;
    font-weight: 700;
    font-size: 20px;
    padding: 10px 28px;
    border-radius: 999px;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 14px rgba(34,197,94,0.35);
    margin-bottom: 28px;
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    text-align: left;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 16px 20px;
  }

  .info-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #64748b;
    margin-bottom: 2px;
  }

  .info-value {
    font-size: 13px;
    color: #e2e8f0;
    font-family: 'Courier New', monospace;
    word-break: break-all;
  }

  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #22c55e;
    border-radius: 50%;
    margin-right: 6px;
    box-shadow: 0 0 8px #22c55e;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .footer {
    margin-top: 24px;
    font-size: 12px;
    color: #475569;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🚀</div>
    <h1>Flask DevOps Demo</h1>
    <p class="subtitle">CI/CD &amp; GitOps Pipeline — Live Deployment</p>

    <div class="version-badge">v{{ version }}</div>

    <div class="info-grid">
      <div>
        <div class="info-label">Status</div>
        <div class="info-value"><span class="status-dot"></span>Healthy</div>
      </div>
      <div>
        <div class="info-label">Pod Hostname</div>
        <div class="info-value">{{ hostname }}</div>
      </div>
    </div>

    <div class="footer">Deployed via GitHub Actions → Docker Hub → ArgoCD → Kubernetes</div>
  </div>
</body>
</html>
